<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversational AI Course Launch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === RESET === */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* === BODY === */
    body {
      font-family: "Inter", sans-serif;
      background: #1b2c3e;
      color: #f3f8fc;
    }

    /* === SLIDE LAYOUT — fills full iframe === */
    .mobile-layout {
      width: 100%;
      height: 100vh;
      /* Fallback if 100vh misbehaves in iframe */
      min-height: 100%;
      background-color: #223144;
      background-image: url("assets/images/hero.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center top;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* === HERO SPACER === */
    .hero {
      width: 100%;
      /* Use a percentage of the container rather than vh so it works in iframes */
      flex: 0 0 52%;
      max-height: 26rem;
      min-height: 12rem;
    }

    /* === MAIN CONTENT === */
    main {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.65rem;
      padding: 0.75rem 1.2rem 1.4rem;
      flex: 1;
      position: relative;
      min-height: 0;
    }

    /* === TITLE === */
    .course-title {
      margin: 0;
      color: #f5faff;
      font-size: clamp(1.2rem, 5.5vw, 1.95rem);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* === METADATA ROW === */
    .course-meta {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.32rem;
      flex-wrap: nowrap;
    }

    .course-meta li {
      min-width: 0;
      color: #c8dce9;
      font-size: clamp(0.65rem, 1.8vw, 0.8125rem);
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 500;
      flex-shrink: 0;
    }

    .course-meta li.meta-item { white-space: nowrap; }

    .course-meta li.meta-item.resources {
      white-space: normal;
      flex-direction: row;
      align-items: center;
      gap: 0.22rem;
      max-width: 6.8rem;
      line-height: 1.1;
    }

    .course-meta li.meta-item.resources span {
      word-break: break-word;
      text-align: left;
    }

    .midline {
      height: 1.2rem;
      width: 0.08rem;
      display: block;
      opacity: 0.8;
      object-fit: contain;
    }

    .meta-icon {
      height: 1.1rem;
      width: auto;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
    }

    .icon-duration { height: 1.12rem; }
    .icon-quiz     { height: 1.12rem; }
    .icon-resource { height: 1.08rem; }

    /* === ACTIONS === */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
      margin-top: 0.4rem;
    }

    button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      border-radius: 999rem;
      overflow: hidden;
      transition: filter 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary {
      flex: 0 0 auto;
      width: 58%;
      aspect-ratio: 409 / 110;
    }

    .btn-audio {
      flex: 0 0 auto;
      width: 38%;
      aspect-ratio: 269 / 76;
    }

    .btn-primary img,
    .btn-audio img {
      width: 100%;
      height: auto;
      display: block;
    }

    button:hover  { filter: brightness(1.08); }
    button:active { transform: translateY(0.0625rem); }
    button:focus-visible {
      outline: 0.1875rem solid #ffffff;
      outline-offset: 0.15rem;
      box-shadow: 0 0 0 0.28rem rgba(0, 216, 230, 0.4);
    }

    /* === DESKTOP (769px+) === */
    @media (min-width: 769px) {
      .hero {
        flex: 0 0 55%;
        max-height: 36rem;
        min-height: 18rem;
      }

      main {
        justify-content: flex-start;
        padding: 2rem 2.8rem 2.4rem;
        gap: 1.1rem;
      }

      .course-title {
        font-size: clamp(1.6rem, 2.4vw, 2.4rem);
        line-height: 1.18;
        letter-spacing: -0.02em;
      }

      .course-meta { gap: 0.55rem; }
      .course-meta li {
        font-size: clamp(0.8rem, 1vw, 0.9375rem);
        gap: 0.35rem;
      }

      .meta-icon       { height: 1.25rem; }
      .icon-duration   { height: 1.28rem; }
      .icon-quiz       { height: 1.28rem; }
      .icon-resource   { height: 1.22rem; }
      .midline         { height: 1.35rem; width: 0.09rem; }

      .course-meta li.meta-item.resources { max-width: 9rem; }

      .actions {
        justify-content: flex-start;
        gap: 0.75rem;
        margin-top: 0.55rem;
      }

      .btn-primary { width: 220px; }
      .btn-audio   { width: 172px; }
    }

    /* === SMALL SCREENS (≤375px) === */
    @media (max-width: 375px) {
      .hero {
        flex: 0 0 50%;
        max-height: 18rem;
        min-height: 11rem;
      }

      main {
        padding: 0.6rem 0.9rem 1rem;
        gap: 0.5rem;
      }

      .course-title { font-size: clamp(1.1rem, 5.5vw, 1.4rem); }

      .course-meta li {
        font-size: 0.65rem;
        gap: 0.2rem;
      }

      .meta-icon     { height: 0.95rem; }
      .midline       { height: 1rem; width: 0.07rem; }
      .icon-duration { height: 0.95rem; }
      .icon-quiz     { height: 0.95rem; }
      .icon-resource { height: 0.92rem; }

      .btn-primary { width: 56%; }
      .btn-audio   { width: 39%; }
    }

    /* === VERY SHORT VIEWPORTS (landscape phones, short iframes) === */
    @media (max-height: 500px) {
      .hero {
        flex: 0 0 45%;
        min-height: 8rem;
      }

      main {
        gap: 0.35rem;
        padding: 0.5rem 1rem 0.8rem;
      }

      .course-title { font-size: clamp(0.95rem, 4vw, 1.3rem); }
    }

    /* === TABLET PORTRAIT (600-900px height) === */
    @media (min-height: 600px) and (max-height: 900px) {
      .hero {
        flex: 0 0 54%;
        max-height: 28rem;
      }

      main {
       padding: 2rem 1.5rem 0.5rem;
        gap: 1.75rem;
      }

      .course-title {
        font-size: clamp(1.3rem, 5.8vw, 2rem);
      }

      .course-meta li {
        font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      }

      .meta-icon       { height: 1.15rem; }
      .icon-duration   { height: 1.18rem; }
      .icon-quiz       { height: 1.18rem; }
      .icon-resource   { height: 1.12rem; }
    }

    /* === TALL PHONES / TABLETS (900px+ height) === */
    @media (min-height: 900px) {
      .hero {
        flex: 0 0 56%;
        max-height: 32rem;
      }

      main {
        padding: 1.2rem 1.6rem 1.8rem;
        gap: 0.8rem;
      }

      .course-title {
        font-size: clamp(1.4rem, 6vw, 2.2rem);
        line-height: 1.25;
      }

      .course-meta li {
        font-size: clamp(0.75rem, 1.9vw, 0.9rem);
        gap: 0.3rem;
      }

      .meta-icon       { height: 1.2rem; }
      .icon-duration   { height: 1.22rem; }
      .icon-quiz       { height: 1.22rem; }
      .icon-resource   { height: 1.16rem; }
      .midline         { height: 1.3rem; }

      .actions {
        gap: 0.6rem;
        margin-top: 0.5rem;
      }

      .btn-primary { width: 60%; }
      .btn-audio   { width: 39%; }
    }

    /* === WIDE PHONES / SMALL TABLETS (width 500-768px) === */
    @media (min-width: 500px) and (max-width: 768px) {
      .hero {
        flex: 0 0 53%;
      }

      main {
        padding: 1rem 1.5rem 1.4rem;
        gap: 0.7rem;
      }

      .course-title {
        font-size: clamp(1.4rem, 5.5vw, 2rem);
      }

      .course-meta li {
        font-size: clamp(0.75rem, 1.8vw, 0.85rem);
        gap: 0.28rem;
      }

      .meta-icon { height: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="mobile-layout">

    <!-- HERO -->
    <header
      class="hero"
      role="img"
      aria-label="Professional using a smartphone to interact with an AI assistant interface"
    ></header>

    <!-- CONTENT -->
    <main>

      <section aria-labelledby="course-title">
        <h1 id="course-title" class="course-title">Conversational AI:<br>Concepts, Capabilities,<br>and Use Cases</h1>
      </section>

      <section aria-label="Course details">
        <ul class="course-meta">
          <li class="meta-item duration">
            <img class="meta-icon icon-duration" src="assets/images/icon_course%20duration.png" alt="" aria-hidden="true">
            <span>20 Min</span>
          </li>
          <li class="divider" aria-hidden="true">
            <img class="midline" src="assets/images/icon_midline.png" alt="">
          </li>
          <li class="meta-item quiz">
            <img class="meta-icon icon-quiz" src="assets/images/icon_Quizes.png" alt="" aria-hidden="true">
            <span>3 Quiz Items</span>
          </li>
          <li class="divider" aria-hidden="true">
            <img class="midline" src="assets/images/icon_midline.png" alt="">
          </li>
          <li class="meta-item resources">
            <img class="meta-icon icon-resource" src="assets/images/icon_Downloadable%20resources.png" alt="" aria-hidden="true">
            <span>Downloadable Resources</span>
          </li>
        </ul>
      </section>

      <section class="actions" aria-label="Course actions">
        <button type="button" class="btn-primary" aria-label="Begin course">
          <img src="assets/images/Bitmap2.png" alt="BEGIN COURSE">
        </button>
        <button type="button" class="btn-audio" aria-label="Play audio version">
          <img src="assets/images/Bitmap4.png" alt="Audio Version">
        </button>
      </section>

    </main>
  </div>
</body>
</html>
