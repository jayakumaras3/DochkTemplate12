<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conversational AI Course</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --navy: #1b2a3e;
      --grey: #96b0c6;
      --white: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #111d2b;
      font-family: 'Source Sans 3', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full viewport card */
    .c-card {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Hero — fixed at 55% of viewport height, image cropped to fit */
    .c-hero {
      flex: 0 0 55%;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    .c-hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* Body — remaining 45% */
    .c-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 16px 18px 20px;
      overflow: hidden;
    }

    /* Title */
    .c-title {
      font-size: clamp(1.25rem, 4.8vw, 1.55rem);
      font-weight: 800;
      line-height: 1.2;
      color: var(--white);
      letter-spacing: -.015em;
      margin: 0;
    }

    /* Meta strip */
    .c-meta {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
    /*  border-top: 1px solid rgba(255,255,255,.08);*/
      padding-top: 10px;
    }

    .c-meta__item {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .c-meta__icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .c-meta__label {
      font-size: .68rem;
      font-weight: 600;
      color: var(--grey);
      line-height: 1.25;
      white-space: nowrap;
    }

    .c-meta__item--dl .c-meta__label {
      white-space: normal;
      max-width: 65px;
    }

    .c-meta__pipe {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,.15);
      flex-shrink: 0;
      margin: 0 8px;
    }

    .c-meta__pipe-img {
      height: 20px;
      width: auto;
      flex-shrink: 0;
      margin: 0 8px;
      display: block;
    }

    /* Buttons */
    .c-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .c-btn {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform .14s ease, filter .14s ease;
    }

    .c-btn:hover  { transform: translateY(-2px); filter: brightness(1.08); }
    .c-btn:active { transform: translateY(1px);  filter: brightness(.93);  }
    .c-btn:focus-visible { outline: 2px solid #00c4cc; outline-offset: 3px; border-radius: 50px; }

    .c-btn--begin img { height: 46px; width: auto; display: block; }
    .c-btn--audio img { height: 36px; width: auto; display: block; }

    /* Tablet/Desktop — center the card */
    @media (min-width: 480px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .c-card {
        max-width: 475px;
      /*  border-radius: 18px; */
        box-shadow: 0 40px 80px rgba(0,0,0,.65);
      }
    }
  </style>
</head>
<body>

  <div class="c-card">

    <!-- Hero image — cropped to 55% height -->
    <div class="c-hero">
      <img
        src="Screen_01_Top_part_1150_x_1150.png"
        alt="Conversational AI Course Header"
      />
    </div>

    <!-- Body -->
    <div class="c-body">

      <h1 class="c-title">
        Conversational AI:<br>
        Concepts, Capabilities,<br>
        and Use Cases
      </h1>

      <div class="c-meta">
        <div class="c-meta__item">
          <img class="c-meta__icon" src="icon_course_duration.png" alt="Duration"/>
          <span class="c-meta__label">20 Min</span>
        </div>

        <img class="c-meta__pipe-img" src="icon_midline.png" alt="|"/>

        <div class="c-meta__item">
          <img class="c-meta__icon" src="icon_Quizes.png" alt="Quiz"/>
          <span class="c-meta__label">3 Quiz Items</span>
        </div>

        <img class="c-meta__pipe-img" src="icon_midline.png" alt="|"/>

        <div class="c-meta__item c-meta__item--dl">
          <img class="c-meta__icon" src="icon_Downloadable_resources.png" alt="Downloads"/>
          <span class="c-meta__label">Downloadable<br>Resources</span>
        </div>
      </div>

      <div class="c-btns">
        <button class="c-btn c-btn--begin" type="button" aria-label="Begin Course">
          <img src="Bitmap3.png" alt="Begin Course"/>
        </button>
        <button class="c-btn c-btn--audio" type="button" aria-label="Audio Version">
          <img src="Bitmap5.png" alt="Audio Version"/>
        </button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
