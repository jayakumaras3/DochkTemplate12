<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversational AI Course Launch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === RESET === */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }

    /* === BODY === */
    body {
      font-family: "Inter", sans-serif;
      background: #1b2c3e;
      color: #f3f8fc;
      display: block;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    /* === SLIDE LAYOUT — fills full viewport === */
    .mobile-layout {
      width: 100%;
      max-width: none;
      height: 100vh;
      margin: 0;
      background-color: #223144;
      background-image: url("assets/images/hero.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center top;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }



    /* === HERO SPACER === */
    .hero {
      width: 100%;
      height: 40vh;
      max-height: 20rem;
      min-height: 13rem;
      flex-shrink: 0;
    }

    /* === MAIN CONTENT === */
    main {
      display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding: 9.9rem 1.2rem 1rem;
    flex: 1;
    position: relative;
    min-height: 0;
    }

    /* === TITLE === */
    .course-title {
      margin: 0;
      color: #f5faff;
      font-size: clamp(1.35rem, 6.2vw, 1.95rem);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* === METADATA ROW === */
    .course-meta {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.32rem;
      flex-wrap: nowrap;
    }

    .course-meta li {
      min-width: 0;
      color: #c8dce9;
      font-size: clamp(0.7rem, 1.8vw, 0.8125rem);
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 500;
      padding: 0;
      flex-shrink: 0;
    }

    .course-meta li.meta-item {
      gap: 0.25rem;
      white-space: nowrap;
    }

    .course-meta li.meta-item.resources {
        white-space: normal;
        flex-direction: row;
        align-items: center;
        gap: 0.22rem;
        max-width: 6.8rem;
        line-height: 1.1;
    }

    .course-meta li.meta-item.resources span {
      word-break: break-word;
      text-align: left;
    }
    .course-meta li.divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex-shrink: 0;
    }

    .midline {
      height: 1.2rem;
      width: 0.08rem;
      display: block;
      opacity: 0.8;
      transform: none;
      object-fit: contain;
    }

    .meta-icon {
      height: 1.1rem;
      width: auto;
      flex-shrink: 0;
      display: block;
      transform: none;
      object-fit: contain;
    }

    .icon-duration { height: 1.12rem; }
    .icon-quiz { height: 1.12rem; }
    .icon-resource { height: 1.08rem; }

    /* === ACTIONS === */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
      margin-top: 0.4rem;
    }

    /* Shared button reset */
    button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      border-radius: 999rem;
      overflow: hidden;
      transition: filter 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    /* Button images */
    .btn-primary {
      flex: 0 0 auto;
      width: 58%;
      aspect-ratio: 409 / 110;
    }

    .btn-audio {
      flex: 0 0 auto;
      width: 38%;
      aspect-ratio: 269 / 76;
    }

    .btn-primary img,
    .btn-audio img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Hover / active / focus */
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(0.0625rem); }

    button:focus-visible {
      outline: 0.1875rem solid #ffffff;
      outline-offset: 0.15rem;
      box-shadow: 0 0 0 0.28rem rgba(0, 216, 230, 0.4);
    }

    /* === SMALL SCREENS (320px) === */
    @media (max-width: 375px) {
      .hero {
        height: 35vh;
        max-height: 16rem;
        min-height: 10rem;
      }

      main {
        padding: 0.8rem 1rem 0.9rem;
        gap: 0.5rem;
      }

      .course-title {
        font-size: clamp(1.2rem, 5.8vw, 1.5rem);
      }

      .course-meta li {
        font-size: 0.7rem;
        gap: 0.2rem;
      }

      .meta-icon {
        height: 0.95rem;
        width: auto;
      }

      .midline {
        height: 1rem;
        width: 0.07rem;
      }

      .icon-duration { height: 0.95rem; }
      .icon-quiz { height: 0.95rem; }
      .icon-resource { height: 0.92rem; }

      .btn-primary { width: 56%; }
      .btn-audio { width: 39%; }
    }
  </style>
</head>
<body>
  <div class="mobile-layout">

    <!-- HERO -->
    <header
      class="hero"
      role="img"
      aria-label="Professional using a smartphone to interact with an AI assistant interface"
    >
    </header>

    <!-- CONTENT -->
    <main>

      <!-- Title -->
      <section aria-labelledby="course-title">
        <h1 id="course-title" class="course-title">Conversational AI:<br>Concepts, Capabilities,<br>and Use Cases</h1>
      </section>

      <!-- Metadata -->
      <section aria-label="Course details">
        <ul class="course-meta">
          <li class="meta-item duration">
            <img class="meta-icon icon-duration" src="assets/images/icon_course%20duration.png" alt="" aria-hidden="true">
            <span>20 Min</span>
          </li>
          <li class="divider" aria-hidden="true">
            <img class="midline" src="assets/images/icon_midline.png" alt="">
          </li>
          <li class="meta-item quiz">
            <img class="meta-icon icon-quiz" src="assets/images/icon_Quizes.png" alt="" aria-hidden="true">
            <span>3 Quiz Items</span>
          </li>
          <li class="divider" aria-hidden="true">
            <img class="midline" src="assets/images/icon_midline.png" alt="">
          </li>
          <li class="meta-item resources">
            <img class="meta-icon icon-resource" src="assets/images/icon_Downloadable%20resources.png" alt="" aria-hidden="true">
            <span>Downloadable Resources</span>
          </li>
        </ul>
      </section>

      <!-- Buttons -->
      <section class="actions" aria-label="Course actions">
        <button type="button" class="btn-primary" aria-label="Begin course">
          <img src="assets/images/Bitmap2.png" alt="BEGIN COURSE">
        </button>
        <button type="button" class="btn-audio" aria-label="Play audio version">
          <img src="assets/images/Bitmap4.png" alt="Audio Version">
        </button>
      </section>

    </main>
  </div>
</body>
</html>
