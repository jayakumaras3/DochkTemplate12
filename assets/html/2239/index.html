<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Conversational AI Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════
       FIX: html & body must NOT clip
       and must allow scrolling on large
       displays so nothing is ever hidden
    ══════════════════════════════════ */
    html {
      width: 100%;
      min-height: 100%;
      /* Prevent any browser-level offset */
      overflow-x: hidden;
    }

    body {
      background: #0f1923;
      font-family: 'Source Sans 3', sans-serif;
      -webkit-font-smoothing: antialiased;

      /* ── FIX: Safe centering for 2K / 4K ── */
      /* Use flex on body but make it a scroll container,
         NOT overflow:hidden, so the card is never clipped  */
      display: flex;
      flex-direction: column;      /* stack vertically */
      align-items: center;         /* horizontal centre  */
      justify-content: center;     /* vertical centre    */
      min-height: 100vh;
      min-height: 100dvh;

      /* KEY FIX: allow body to grow taller than viewport
         on very large displays rather than squishing the card */
      overflow-x: hidden;          /* never scroll sideways  */
      overflow-y: auto;            /* scroll vertically if needed */

      /* Ensure body itself fills the viewport width fully
         so centering math is based on the whole screen    */
      width: 100%;
    }

    /* ══════════════════════════════════
       CARD
    ══════════════════════════════════ */
    .c-card {
      /* FIX: use explicit width + auto side margins as a belt-and-suspenders
         centering strategy alongside flex — this is what keeps the card
         centred on 2K/4K when flex alone can drift due to scrollbar width  */
      width: min(480px, 100vw);    /* never wider than viewport             */
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;

      height: 100vh;
      height: 100dvh;

      background: #1b2a3e;
      display: flex;
      flex-direction: column;

      /* FIX: remove overflow-x hidden from the card — clipping was happening
         here on wide viewports when the card was mis-positioned.
         We only need it on the hero for the image crop effect.             */
      overflow: hidden;

      /* Ensure card never goes below the viewport on very small heights    */
      min-height: 0;

      /* Prevent card from ever being pushed outside left edge              */
      position: relative;
    }

    /* ══════════════════════════════════
       HERO  (JS sets exact px height)
    ══════════════════════════════════ */
    .c-hero {
      flex: 0 0 auto;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }
    .c-hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* ══════════════════════════════════
       BODY  — flex column
       Two equal spacers sandwich the
       content so spacing is always equal
       top & bottom regardless of height
    ══════════════════════════════════ */
    .c-body {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 5%;
      overflow: hidden;
    }

    /* Equal flex spacers above & below content */
    .c-spacer-top {
      flex: 0.4 1 0%;
      min-height: 0;
    }
    .c-spacer-bottom {
      flex: 0.8 1 0%;
      min-height: 8px;
    }

    /* ══════════════════════════════════
       CONTENT  — title + meta + buttons
    ══════════════════════════════════ */
    .c-content {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vh, 18px);
      overflow: visible;
    }

    /* ── Title ── */
    .c-title {
      color: #fff;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -.015em;
      font-size: clamp(1.32rem, 3.3vw + 1.95vh, 2.78rem);
    }

    /* ── Meta strip ── */
    .c-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 0;
    }

    .c-meta__item {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.7vw, 7px);
      flex-shrink: 0;
    }

    .c-meta__icon {
      width:  clamp(16px, 1.8vw + 0.8vh, 20px);
      height: clamp(16px, 1.8vw + 0.8vh, 20px);
      object-fit: contain;
      flex-shrink: 0;
    }

    .c-meta__label {
      color: #96b0c6;
      font-weight: 600;
      line-height: 1.2;
      font-size: clamp(0.58rem, 0.9vw + 0.35vh, 0.72rem);
      white-space: nowrap;
    }

    .c-meta__item--dl .c-meta__label {
      white-space: normal;
      max-width: clamp(46px, 10vw, 70px);
    }

    .c-meta__pipe-img {
      flex-shrink: 0;
      height: clamp(16px, 1.8vw + 0.8vh, 20px);
      width: auto;
      display: block;
      margin: 0 clamp(5px, 1.0vw, 10px);
    }

    /* ── Buttons ── */
    .c-btns {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(6px, 1.4vw, 12px);
    }

    .c-btn {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      flex-shrink: 1;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform .13s ease, filter .13s ease;
    }
    .c-btn:hover         { transform: translateY(-2px); filter: brightness(1.09); }
    .c-btn:active        { transform: translateY(1px);  filter: brightness(.92);  }
    .c-btn:focus-visible { outline: 2px solid #00c4cc; outline-offset: 3px; border-radius: 50px; }

    .c-btn--begin img {
      display: block;
      height: clamp(32px, 1.4vw + 4.2vh, 56px);
      width: auto;
      max-width: 100%;
    }
    .c-btn--audio img {
      display: block;
      height: clamp(26px, 1.1vw + 3.6vh, 46px);
      width: auto;
      max-width: 100%;
    }

    /* ══════════════════════════════════
       BREAKPOINTS
    ══════════════════════════════════ */

    /* Full-bleed when frame is too narrow for side margins */
    @media (max-width: 540px) {
      body { align-items: flex-start; justify-content: flex-start; }
      .c-card { max-width: 100%; border-radius: 0; box-shadow: none; }
    }

    /* Rounded card — only when viewport has room for equal side margins */
    @media (min-width: 541px) {
      .c-card {
        border-radius: 18px;
        box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
      }
    }

    /* Tablet / desktop */
    @media (min-width: 768px) {
      .c-card { max-width: 520px; width: min(520px, 100vw); }
    }

    /* ── 2K / 4K explicit safety net ──
       On very large displays ensure the card is
       always rendered within the visible viewport
       and centred with equal whitespace on both sides. */
    @media (min-width: 1440px) {
      body {
        /* Re-affirm flex centering at large widths */
        justify-content: center;
        align-items: center;
      }
      .c-card {
        /* Keep card proportional — never stretch beyond 520px */
        max-width: 520px;
        width: 520px;
        /* Belt-and-suspenders: auto margins guarantee centering
           even if the flex context has any scrollbar-width offset */
        margin-left: auto;
        margin-right: auto;
        /* Ensure card height matches viewport, not physical screen */
        height: 100vh;
        height: 100dvh;
      }
    }

    /* Landscape phone → side-by-side */
    @media (orientation: landscape) and (max-height: 520px) {
      .c-card  { flex-direction: row; max-width: 100%; width: 100%; border-radius: 0; }
      .c-hero  { flex: 0 0 48%; height: 100%; }
      .c-body  { padding: 0 4%; }
      .c-title { font-size: clamp(0.8rem, 2vw + 0.8vh, 1.15rem); }
    }
  </style>
</head>
<body>

  <div class="c-card" id="card">

    <!-- Hero -->
    <div class="c-hero" id="hero">
      <img src="Screen_01_Top_part_1150_x_1150.png" alt="Conversational AI Course Header"/>
    </div>

    <!-- Body -->
    <div class="c-body">

      <div class="c-spacer-top"></div>

      <div class="c-content">

        <section aria-labelledby="course-title" role="region" aria-label="Course introduction">
          <h1 id="course-title" class="c-title" tabindex="0">
            Conversational AI:<br>
            Concepts, Capabilities,<br>
            and Use Cases
          </h1>
        </section>

        <div class="c-meta" role="region" aria-label="Course details">
          <div class="c-meta__item" tabindex="0" role="article" aria-label="Duration: 20 minutes">
            <img class="c-meta__icon" src="icon_course_duration.png" alt=""/>
            <span class="c-meta__label">20 Min</span>
          </div>
          <img class="c-meta__pipe-img" src="icon_midline.png" alt="" role="presentation"/>
          <div class="c-meta__item" tabindex="0" role="article" aria-label="Quiz count: 3 quiz items">
            <img class="c-meta__icon" src="icon_Quizes.png" alt=""/>
            <span class="c-meta__label">3 Quiz Items</span>
          </div>
          <img class="c-meta__pipe-img" src="icon_midline.png" alt="" role="presentation"/>
          <div class="c-meta__item c-meta__item--dl" tabindex="0" role="article" aria-label="Downloadable resources available">
            <img class="c-meta__icon" src="icon_Downloadable_resources.png" alt=""/>
            <span class="c-meta__label">Downloadable<br>Resources</span>
          </div>
        </div>

        <div class="c-btns">
          <button class="c-btn c-btn--begin" type="button" aria-label="Begin Course" onclick="startCourse()">
            <img src="Bitmap3.png" alt="Begin Course"/>
          </button>
          <button class="c-btn c-btn--audio" type="button" aria-label="Audio Version" onclick="playAudio()">
            <img src="Bitmap5.png" alt="Audio Version"/>
          </button>
        </div>

      </div>

      <div class="c-spacer-bottom"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ── No JS changes — functionality preserved exactly ── */
    function startCourse() {
      parent.beginButCall();
    }

    function playAudio() {
      parent.audioButCall();
    }

    (function () {
      var card = document.getElementById('card');
      var hero = document.getElementById('hero');

      function update() {
        var isLandscape = window.matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
        if (isLandscape) {
          hero.style.height = '';
          return;
        }
        var cardH = card.getBoundingClientRect().height;
        hero.style.height = (cardH * 0.58).toFixed(1) + 'px';
      }

      update();
      window.addEventListener('resize', update);
      window.addEventListener('orientationchange', function () { setTimeout(update, 150); });
    })();
  </script>
</body>
</html>
