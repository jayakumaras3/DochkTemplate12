<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Conversational AI Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      background: #0f1923;
      font-family: 'Source Sans 3', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ══════════════════════════════════
       CARD
    ══════════════════════════════════ */
    .c-card {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background: #1b2a3e;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* ══════════════════════════════════
       HERO
    ══════════════════════════════════ */
    .c-hero {
      flex: 0 0 auto;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }
    .c-hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* ══════════════════════════════════
       BODY
    ══════════════════════════════════ */
    .c-body {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 5%;
      overflow: hidden;
    }

    .c-spacer-top    { flex: 0.4 1 0%; min-height: 0; }
    .c-spacer-bottom { flex: 0.8 1 0%; min-height: 8px; }

    /* ══════════════════════════════════
       CONTENT
    ══════════════════════════════════ */
    .c-content {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vh, 18px);
      overflow: visible;
    }

    .c-title {
      color: #fff;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -.015em;
      font-size: clamp(1.32rem, 3.3vw + 1.95vh, 2.78rem);
    }

    .c-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 0;
    }
    .c-meta__item {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.7vw, 7px);
      flex-shrink: 0;
    }
    .c-meta__icon {
      width:  clamp(16px, 1.8vw + 0.8vh, 20px);
      height: clamp(16px, 1.8vw + 0.8vh, 20px);
      object-fit: contain;
      flex-shrink: 0;
    }
    .c-meta__label {
      color: #96b0c6;
      font-weight: 600;
      line-height: 1.2;
      font-size: clamp(0.58rem, 0.9vw + 0.35vh, 0.72rem);
      white-space: nowrap;
    }
    .c-meta__item--dl .c-meta__label {
      white-space: normal;
      max-width: clamp(46px, 10vw, 70px);
    }
    .c-meta__pipe-img {
      flex-shrink: 0;
      height: clamp(16px, 1.8vw + 0.8vh, 20px);
      width: auto;
      display: block;
      margin: 0 clamp(5px, 1.0vw, 10px);
    }

    .c-btns {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(6px, 1.4vw, 12px);
    }
    .c-btn {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      flex-shrink: 1;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform .13s ease, filter .13s ease;
    }
    .c-btn:hover         { transform: translateY(-2px); filter: brightness(1.09); }
    .c-btn:active        { transform: translateY(1px);  filter: brightness(.92);  }
    .c-btn:focus-visible { outline: 2px solid #00c4cc; outline-offset: 3px; border-radius: 50px; }

    .c-btn--begin img {
      display: block;
      height: clamp(32px, 1.4vw + 4.2vh, 56px);
      width: auto;
      max-width: 100%;
    }
    .c-btn--audio img {
      display: block;
      height: clamp(26px, 1.1vw + 3.6vh, 46px);
      width: auto;
      max-width: 100%;
    }

    /* ══════════════════════════════════
       BREAKPOINTS — original, unchanged
    ══════════════════════════════════ */
    @media (max-width: 540px) {
      body { align-items: flex-start; justify-content: flex-start; }
      .c-card { max-width: 100%; border-radius: 0; box-shadow: none; }
    }
    @media (min-width: 541px) {
      .c-card {
        border-radius: 18px;
        box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
      }
    }
    @media (min-width: 768px) {
      .c-card { max-width: 520px; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .c-card  { flex-direction: row; max-width: 100%; border-radius: 0; }
      .c-hero  { flex: 0 0 48%; height: 100%; }
      .c-body  { padding: 0 4%; }
      .c-title { font-size: clamp(0.8rem, 2vw + 0.8vh, 1.15rem); }
    }
  </style>
</head>
<body>

  <div class="c-card" id="card">

    <div class="c-hero" id="hero">
      <img src="Screen_01_Top_part_1150_x_1150.png" alt="Conversational AI Course Header"/>
    </div>

    <div class="c-body">
      <div class="c-spacer-top"></div>

      <div class="c-content">
        <h1 class="c-title">
          Conversational AI:<br>
          Concepts, Capabilities,<br>
          and Use Cases
        </h1>

        <div class="c-meta">
          <div class="c-meta__item">
            <img class="c-meta__icon" src="icon_course_duration.png" alt="Duration"/>
            <span class="c-meta__label">20 Min</span>
          </div>
          <img class="c-meta__pipe-img" src="icon_midline.png" alt="" role="presentation"/>
          <div class="c-meta__item">
            <img class="c-meta__icon" src="icon_Quizes.png" alt="Quiz"/>
            <span class="c-meta__label">3 Quiz Items</span>
          </div>
          <img class="c-meta__pipe-img" src="icon_midline.png" alt="" role="presentation"/>
          <div class="c-meta__item c-meta__item--dl">
            <img class="c-meta__icon" src="icon_Downloadable_resources.png" alt="Downloads"/>
            <span class="c-meta__label">Downloadable<br>Resources</span>
          </div>
        </div>

        <div class="c-btns">
          <button class="c-btn c-btn--begin" type="button"
                  aria-label="Begin Course" onclick="startCourse()">
            <img src="Bitmap3.png" alt="Begin Course"/>
          </button>
          <button class="c-btn c-btn--audio" type="button"
                  aria-label="Audio Version" onclick="playAudio()">
            <img src="Bitmap5.png" alt="Audio Version"/>
          </button>
        </div>
      </div>

      <div class="c-spacer-bottom"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ── SCORM callbacks — unchanged ── */
    function startCourse() { parent.beginButCall(); }
    function playAudio()   { parent.audioButCall(); }

    (function () {
      var card = document.getElementById('card');
      var hero = document.getElementById('hero');

      /* ── Hero height — original unchanged logic ── */
      function updateHero() {
        var isLandscape = window.matchMedia(
          '(orientation: landscape) and (max-height: 520px)'
        ).matches;
        if (isLandscape) { hero.style.height = ''; return; }
        var cardH = card.getBoundingClientRect().height;
        hero.style.height = (cardH * 0.58).toFixed(1) + 'px';
      }

      /* ══════════════════════════════════════════════════════
         2K / 4K CENTERING FIX
         ──────────────────────────────────────────────────────
         The SCORM player on 2K/4K gives this page a narrow
         iframe starting partway across the screen. Body flex
         centres the card inside that narrow iframe — which
         looks off-centre on the actual monitor.

         Fix: nudge body's justify-content by adjusting its
         padding-left so the card visually sits at true screen
         centre. No DOM changes. No overlays. No moved elements.

         Only activates when screen.width >> innerWidth (2K/4K).
         On normal screens the gap is 0 so nothing changes.
      ══════════════════════════════════════════════════════ */
      function fix2k() {
        try {
          var monitorW = window.screen.width;
          var iframeW  = window.innerWidth;
          var is2K     = (monitorW - iframeW) > 200;

          if (!is2K) {
            /* Normal screen — reset everything */
            card.style.width    = '';
            card.style.maxWidth = '';
            document.body.style.paddingLeft = '';
            return;
          }

          /* ── Step 1: Set card width to 90% of the iframe ──
             This makes the card visibly narrower so the full
             hero image width is displayed correctly.          */
          var newCardW = Math.floor(iframeW * 0.90);
          card.style.width    = newCardW + 'px';
          card.style.maxWidth = newCardW + 'px';

          /* ── Step 2: Centre the card on the REAL monitor ──
             screenX = how far our iframe starts from monitor left edge */
          var screenLeft = (typeof window.screenX !== 'undefined' && window.screenX !== 0)
                            ? window.screenX : (window.screenLeft || 0);

          var trueCenterInIframe = (monitorW / 2) - screenLeft;
          var neededLeft = trueCenterInIframe - (newCardW / 2);
          neededLeft = Math.max(0, Math.min(neededLeft, iframeW - newCardW));

          document.body.style.paddingLeft = neededLeft + 'px';

        } catch (e) {
          card.style.width    = '';
          card.style.maxWidth = '';
          document.body.style.paddingLeft = '';
        }
      }

      function update() {
        fix2k();
        updateHero();
      }

      update();
      window.addEventListener('resize', update);
      window.addEventListener('orientationchange', function () {
        setTimeout(update, 150);
      });
    })();
  </script>
</body>
</html>
