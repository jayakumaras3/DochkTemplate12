<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>eLearning Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-primary:        #1A56DB;
  --c-primary-dk:     #1341B0;
  --c-primary-lt:     #EBF2FF;
  --c-accent:         #06B6D4;
  --c-accent2:        #6366F1;
  --c-text:           #0F172A;
  --c-text-2:         #475569;
  --c-text-3:         #94A3B8;
  --c-bg:             #F1F5F9;
  --c-surface:        #FFFFFF;
  --c-surface-2:      #F8FAFC;
  --c-border:         #E2E8F0;
  --c-border-focus:   #1A56DB;
  --radius-xs:        6px;
  --radius-sm:        10px;
  --radius:           14px;
  --radius-lg:        20px;
  --radius-xl:        28px;
  --font-body:        'DM Sans', system-ui, sans-serif;
  --font-heading:     'Manrope', 'DM Sans', sans-serif;
  --shadow-sm:        0 1px 4px rgba(15,23,42,0.06);
  --shadow-md:        0 4px 20px rgba(26,86,219,0.10);
  --shadow-lg:        0 12px 40px rgba(26,86,219,0.15);
  --shadow-card:      0 2px 12px rgba(15,23,42,0.07), 0 0 0 1px rgba(15,23,42,0.04);
  --transition:       0.22s cubic-bezier(0.4,0,0.2,1);
  --layout-direction: row;
  --media-basis:      46%;
  --layout-gap:       52px;
  --card-padding:     52px;
  --page-max-width:   1120px;
  --page-h-pad:       clamp(16px, 4vw, 56px);
}

html { font-size: 16px; scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--c-bg); color: var(--c-text); min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.6; }

.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
.skip-link { position: absolute; top: -200%; left: 1rem; z-index: 9999; background: var(--c-primary); color: #fff; padding: .5rem 1.2rem; border-radius: var(--radius-sm); font-weight: 700; font-size: .875rem; text-decoration: none; transition: top .2s; }
.skip-link:focus { top: 1rem; }

#page-shell { display: flex; flex-direction: column; min-height: 100vh; max-width: var(--page-max-width); margin: 0 auto; padding: 0 var(--page-h-pad); }

#page-header { padding: clamp(36px,6vh,64px) 0 clamp(20px,3vh,36px); }

.page-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-heading); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--c-primary); margin-bottom: 14px; }
.page-eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent); animation: pulse-dot 2.4s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.6); opacity:.6; } }

.page-title { font-family: var(--font-heading); font-size: clamp(1.8rem, 4.2vw, 2.9rem); font-weight: 800; line-height: 1.12; letter-spacing: -.04em; color: var(--c-text); }
.page-title--left { text-align: left; }
.page-title--center { text-align: center; }
.page-title--right { text-align: right; }

.title-bar { margin-top: 16px; height: 3px; width: 52px; border-radius: 2px; background: linear-gradient(90deg, var(--c-primary), var(--c-accent)); }
.title-bar--center { margin: 16px auto 0; }
.title-bar--right { margin-left: auto; margin-top: 16px; }

#page-main { flex: 1; }

.layout-card { display: flex; flex-direction: row; gap: var(--layout-gap); align-items: stretch; background: var(--c-surface); border-radius: var(--radius-xl); padding: var(--card-padding); box-shadow: var(--shadow-card); border: 1px solid var(--c-border); overflow: hidden; position: relative; transition: flex-direction 0s; }
.layout-card::before { content: ''; position: absolute; top: 0; right: 0; width: 320px; height: 320px; background: radial-gradient(circle at top right, rgba(26,86,219,.06), transparent 70%); pointer-events: none; border-radius: var(--radius-xl); }

.layout-card.image-left { flex-direction: row; }
.layout-card.image-right { flex-direction: row-reverse; }
.layout-card.top-image { flex-direction: column; }
.layout-card.bottom-image { flex-direction: column-reverse; }
.layout-card.full-content { flex-direction: column; }
.layout-card.full-content .media-panel { display: none; }
.layout-card.full-content .content-panel { flex: 1 1 100%; max-width: 100%; }

.layout-card.top-image .media-panel, .layout-card.bottom-image .media-panel { flex: 0 0 100%; width: 100%; max-width: 100%; }
.layout-card.top-image .content-panel, .layout-card.bottom-image .content-panel { flex: 1 1 100%; width: 100%; max-width: 100%; }

.media-panel { flex: 0 0 var(--media-basis); min-width: 0; position: relative; max-width: var(--media-basis); }
.media-figure { margin: 0; width: 100%; height: 100%; min-height: 320px; border-radius: var(--radius-lg); overflow: hidden; position: relative; background: var(--c-primary-lt); }
.media-img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--radius-lg); transition: transform .5s cubic-bezier(0.4,0,0.2,1); }
.media-figure:hover .media-img { transform: scale(1.03); }

.media-placeholder { width: 100%; min-height: 340px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--c-primary-lt) 0%, #DBEAFE 50%, #E0F2FE 100%); border: 2px dashed rgba(26,86,219,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--c-primary); }
.media-placeholder svg { opacity: .45; }
.media-placeholder-text { font-size: .8rem; font-weight: 600; color: var(--c-text-3); font-family: var(--font-heading); }

.media-video { width: 100%; border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 16/9; background: #000; position: relative; }
.media-video iframe, .media-video video { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.media-caption { margin-top: 10px; font-size: .78rem; color: var(--c-text-3); text-align: center; font-style: italic; }

.content-panel { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.content-heading { font-family: var(--font-heading); font-size: clamp(1.15rem, 2.4vw, 1.6rem); font-weight: 700; line-height: 1.28; letter-spacing: -.025em; color: var(--c-text); }

.content-body { font-size: clamp(.88rem, 1.4vw, .98rem); color: var(--c-text-2); line-height: 1.78; }
.content-body p + p { margin-top: .7em; }
.content-body ul, .content-body ol { padding-left: 1.3em; }
.content-body li { margin-bottom: .35em; }
.content-body strong { color: var(--c-text); font-weight: 600; }
.content-body em { font-style: italic; }
.content-body a { color: var(--c-primary); text-underline-offset: 3px; }
.content-body table { width: 100%; border-collapse: collapse; font-size: .875rem; }
.content-body th { background: var(--c-primary-lt); color: var(--c-primary-dk); padding: 8px 12px; text-align: left; font-weight: 700; }
.content-body td { padding: 8px 12px; border-bottom: 1px solid var(--c-border); color: var(--c-text-2); }
.content-body code { font-size: .83em; background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: 4px; padding: 1px 5px; }
.content-body blockquote { border-left: 3px solid var(--c-primary); padding-left: 1rem; color: var(--c-text-2); font-style: italic; }

.feature-list { display: flex; flex-direction: column; gap: 10px; list-style: none; }
.feature-item { display: flex; align-items: flex-start; gap: 14px; padding: 15px 17px; background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: var(--radius); cursor: default; transition: background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition); }
.feature-item:hover, .feature-item:focus-within { background: var(--c-primary-lt); border-color: rgba(26,86,219,.35); transform: translateX(5px); box-shadow: var(--shadow-sm); outline: none; }
.feature-item[tabindex]:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

.feature-icon { flex-shrink: 0; width: 38px; height: 38px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--c-primary-lt), rgba(26,86,219,.12)); border: 1px solid rgba(26,86,219,.15); display: flex; align-items: center; justify-content: center; color: var(--c-primary); transition: background var(--transition); }
.feature-item:hover .feature-icon { background: linear-gradient(135deg, rgba(26,86,219,.15), rgba(6,182,212,.15)); color: var(--c-primary-dk); }
.feature-icon svg { width: 17px; height: 17px; }

.feature-text { flex: 1; min-width: 0; }
.feature-title { font-family: var(--font-heading); font-weight: 700; font-size: .9rem; color: var(--c-text); margin-bottom: 2px; }
.feature-desc { font-size: .82rem; color: var(--c-text-2); line-height: 1.55; }

.callout { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius); font-size: .88rem; line-height: 1.6; }
.callout--info { background: var(--c-primary-lt); border-left: 3px solid var(--c-primary); color: var(--c-primary-dk); }
.callout--success { background: #ECFDF5; border-left: 3px solid #10B981; color: #065F46; }
.callout--warn { background: #FFFBEB; border-left: 3px solid #F59E0B; color: #92400E; }
.callout--danger { background: #FEF2F2; border-left: 3px solid #EF4444; color: #7F1D1D; }
.callout svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; }

.quiz-block { border: 1.5px solid var(--c-border); border-radius: var(--radius-lg); padding: 24px; background: var(--c-surface); box-shadow: var(--shadow-sm); }
.quiz-tag { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c-primary); background: var(--c-primary-lt); padding: 3px 9px; border-radius: 99px; margin-bottom: 12px; }
.quiz-question { font-weight: 600; font-size: .95rem; margin-bottom: 14px; color: var(--c-text); line-height: 1.5; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; list-style: none; }

.quiz-option { display: flex; align-items: center; gap: 11px; padding: 11px 15px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm); cursor: pointer; font-size: .88rem; color: var(--c-text-2); transition: border-color var(--transition), background var(--transition), color var(--transition); user-select: none; }
.quiz-option:hover { border-color: var(--c-primary); background: var(--c-primary-lt); color: var(--c-text); }
.quiz-option.sel { border-color: var(--c-primary); background: var(--c-primary-lt); color: var(--c-primary-dk); font-weight: 600; }
.quiz-option.ok { border-color: #10B981; background: #ECFDF5; color: #065F46; }
.quiz-option.err { border-color: #EF4444; background: #FEF2F2; color: #7F1D1D; }
.quiz-option:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

.quiz-radio { flex-shrink: 0; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--c-border); background: #fff; transition: border-color var(--transition), background var(--transition); display: flex; align-items: center; justify-content: center; }
.quiz-option.sel .quiz-radio { border-color: var(--c-primary); background: var(--c-primary); }
.quiz-option.sel .quiz-radio::after { content:''; width:6px; height:6px; border-radius:50%; background:#fff; }
.quiz-checkbox { flex-shrink: 0; width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--c-border); background: #fff; transition: border-color var(--transition), background var(--transition); display: flex; align-items: center; justify-content: center; }
.quiz-option.sel .quiz-checkbox { border-color: var(--c-primary); background: var(--c-primary); }
.quiz-option.sel .quiz-checkbox::after { content:'✓'; font-size:10px; color:#fff; font-weight:700; }

.quiz-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.quiz-btn { padding: 9px 20px; font-family: var(--font-heading); font-weight: 700; font-size: .83rem; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition), transform var(--transition); }
.quiz-btn--primary { background: var(--c-primary); color: #fff; }
.quiz-btn--primary:hover { background: var(--c-primary-dk); transform: translateY(-1px); }
.quiz-btn--ghost { background: var(--c-surface-2); color: var(--c-text-2); border: 1px solid var(--c-border); }
.quiz-btn--ghost:hover { background: var(--c-border); }
.quiz-feedback { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: .85rem; font-weight: 500; display: none; }
.quiz-feedback.ok { background: #ECFDF5; color: #065F46; border: 1px solid #10B981; display: block; }
.quiz-feedback.err { background: #FEF2F2; color: #7F1D1D; border: 1px solid #EF4444; display: block; }

.tabs-block { border: 1px solid var(--c-border); border-radius: var(--radius-lg); overflow: hidden; }
.tabs-nav { display: flex; background: var(--c-surface-2); border-bottom: 1px solid var(--c-border); overflow-x: auto; scrollbar-width: none; }
.tabs-nav::-webkit-scrollbar { display: none; }
.tab-btn { flex-shrink: 0; padding: 13px 20px; background: none; border: none; border-bottom: 2px solid transparent; font-family: var(--font-heading); font-weight: 600; font-size: .84rem; color: var(--c-text-3); cursor: pointer; transition: color var(--transition), border-color var(--transition); white-space: nowrap; }
.tab-btn[aria-selected="true"] { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.tab-panel { padding: 20px 22px; font-size: .88rem; color: var(--c-text-2); line-height: 1.65; display: none; }
.tab-panel.active { display: block; }

.accordion-block { border: 1px solid var(--c-border); border-radius: var(--radius); overflow: hidden; }
.accordion-item { border-bottom: 1px solid var(--c-border); }
.accordion-item:last-child { border-bottom: none; }
.accordion-trigger { width: 100%; text-align: left; background: none; border: none; padding: 15px 18px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-heading); font-weight: 600; font-size: .88rem; color: var(--c-text); cursor: pointer; gap: 12px; transition: background var(--transition); }
.accordion-trigger:hover { background: var(--c-surface-2); }
.accordion-chevron { flex-shrink: 0; transition: transform .25s; color: var(--c-text-3); }
.accordion-trigger[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); color: var(--c-primary); }
.accordion-trigger[aria-expanded="true"] { color: var(--c-primary); }
.accordion-panel { padding: 0 18px; max-height: 0; overflow: hidden; transition: max-height .3s ease, padding .3s ease; font-size: .86rem; color: var(--c-text-2); line-height: 1.65; }
.accordion-panel.open { max-height: 600px; padding: 0 18px 16px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 12px; }
.stat-card { padding: 18px 14px; background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: var(--radius); text-align: center; }
.stat-value { font-family: var(--font-heading); font-size: 1.7rem; font-weight: 800; color: var(--c-primary); line-height: 1; }
.stat-label { font-size: .75rem; color: var(--c-text-3); margin-top: 5px; font-weight: 500; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item { display: flex; gap: 16px; padding-bottom: 20px; position: relative; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-line-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 28px; }
.timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c-primary); border: 2px solid var(--c-primary-lt); flex-shrink: 0; margin-top: 4px; }
.timeline-vline { flex: 1; width: 2px; background: var(--c-border); margin-top: 4px; }
.timeline-item:last-child .timeline-vline { display: none; }
.timeline-content { flex: 1; min-width: 0; }
.timeline-title { font-family: var(--font-heading); font-weight: 700; font-size: .88rem; color: var(--c-text); }
.timeline-desc { font-size: .82rem; color: var(--c-text-2); margin-top: 3px; line-height: 1.5; }
.timeline-time { font-size: .75rem; color: var(--c-text-3); margin-top: 2px; }

#page-footer { padding: clamp(24px,4vh,44px) 0 clamp(36px,6vh,64px); }

.nav-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

.progress-wrap { flex: 1; max-width: 300px; }
.progress-meta { display: flex; justify-content: space-between; margin-bottom: 7px; }
.progress-label { font-size: .75rem; font-weight: 600; color: var(--c-text-3); font-family: var(--font-heading); letter-spacing: .02em; }
.progress-pct { font-size: .75rem; font-weight: 700; color: var(--c-primary); }
.progress-track { height: 5px; background: var(--c-border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--c-primary), var(--c-accent)); border-radius: 3px; transition: width .7s cubic-bezier(0.4,0,0.2,1); }

.btn-primary { display: inline-flex; align-items: center; gap: 9px; padding: 14px 30px; background: var(--c-primary); color: #fff; font-family: var(--font-heading); font-weight: 700; font-size: .97rem; border: none; border-radius: var(--radius); cursor: pointer; text-decoration: none; box-shadow: 0 4px 18px rgba(26,86,219,.28); letter-spacing: .01em; white-space: nowrap; transition: background var(--transition), transform var(--transition), box-shadow var(--transition); }
.btn-primary:hover { background: var(--c-primary-dk); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,86,219,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 3px; }

.btn-secondary { display: inline-flex; align-items: center; gap: 9px; padding: 13px 26px; background: var(--c-surface); color: var(--c-primary); font-family: var(--font-heading); font-weight: 700; font-size: .9rem; border: 1.5px solid var(--c-primary); border-radius: var(--radius); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--transition), box-shadow var(--transition), transform var(--transition); }
.btn-secondary:hover { background: var(--c-primary-lt); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn-secondary:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 3px; }

.btn-primary svg, .btn-secondary svg { width: 18px; height: 18px; flex-shrink: 0; }

@keyframes fadeUp { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: translateY(0); } }
.anim { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.anim-d1 { animation-delay: .07s; }
.anim-d2 { animation-delay: .14s; }
.anim-d3 { animation-delay: .21s; }
.anim-d4 { animation-delay: .28s; }

#page-loading { position: fixed; inset: 0; background: var(--c-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity .4s ease; }
#page-loading.out { opacity: 0; pointer-events: none; }
.loader-ring { width: 42px; height: 42px; border: 3px solid var(--c-border); border-top-color: var(--c-primary); border-radius: 50%; animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  .layout-card, .layout-card.image-left, .layout-card.image-right, .layout-card.top-image, .layout-card.bottom-image { flex-direction: column !important; padding: clamp(20px, 4vw, 36px); gap: 28px; }
  .layout-card .media-panel, .layout-card .content-panel { flex: 0 0 auto !important; width: 100% !important; max-width: 100% !important; }
  .layout-card.image-right { flex-direction: column !important; }
  .media-figure { min-height: 220px; }
}

@media (max-width: 560px) {
  .nav-row { flex-direction: column; align-items: stretch; }
  .btn-primary, .btn-secondary { justify-content: center; }
  .progress-wrap { max-width: 100%; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media print {
  #page-loading, .btn-primary, .btn-secondary { display: none; }
  .layout-card { box-shadow: none; }
}
</style>
</head>

      <aside id="media-panel" class="media-panel" aria-label="Module media"></aside>

    </div>

  <footer id="page-footer" role="contentinfo"></footer>
</div>

<script id="page-config" type="application/json">
{

  },
  "header": {
    "visible": true, "eyebrow": "eLearning Module 01", "title": "The Future of Modular eLearning", "align": "left", "accentBar": true
  },
  "media": {
    "visible": true, "type": "image", "src": "assets/hero.jpg",
    "alt": "Futuristic conference room with blue geometric ceiling lights and a large display",
    "caption": "", "aspectRatio": "4/3", "borderRadius": "16px"
  },
  "content": {
    "visible": true, "heading": "Dynamic Layouts Driven by Data", "headingTag": "h2",
    "body": "<p>This page demonstrates a fully modular architecture. Instead of hardcoding HTML templates, the entire structure is dictated by a single JSON configuration. The container automatically adapts to responsive screens.</p>",
    "components": [{
      "type": "feature-list",
      "items": [
        { "icon": "grid", "title": "Flexibility", "description": "Change layouts instantly using CSS flex-direction without altering HTML structure." },
        { "icon": "code", "title": "Maintainability", "description": "A single responsive container handles all content variations safely." },
        { "icon": "chart", "title": "Scalability", "description": "Ready to drop in videos, SCQs, MCQs, and interactive components." }
      ]
    }]
  },
  "navigation": {
    "visible": true, "prevLabel": "", "prevHref": "", "nextLabel": "Continue to Next Module",
    "nextHref": "#", "showProgress": true, "currentPage": 1, "totalPages": 5
  }
}
</script>

<script>
'use strict';

const IC = {
  grid: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zm9.75-9.75c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v16.5c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V3.375zm-6.75 6c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v10.5c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125v-10.5z"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9A2.25 2.25 0 0013.5 5.25h-9A2.25 2.25 0 002.25 7.5v9A2.25 2.25 0 004.5 18.75z"/></svg>`,
  quiz: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>`,
  warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>`,
  img: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>`,
  arrowR: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>`,
  arrowL: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>`,
};

const esc = s => typeof s === 'string' ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : String(s ?? '');
const uid = () => Math.random().toString(36).slice(2, 8);

function applyTheme(t = {}) {
  const r = document.documentElement;
  const map = { '--c-primary': t.primary, '--c-primary-dk': t.primaryDark, '--c-primary-lt': t.primaryLight, '--c-accent': t.accent, '--c-text': t.text, '--c-text-2': t.text2, '--c-text-3': t.text3, '--c-bg': t.bg, '--c-surface': t.surface, '--c-surface-2': t.surface2, '--c-border': t.border, '--radius': t.radiusBase, '--radius-lg': t.radiusLg, '--radius-xl': t.radiusXl };
  Object.entries(map).forEach(([k, v]) => { if (v) r.style.setProperty(k, v); });
}

const LAYOUT_TYPES = ['image-left','image-right','top-image','bottom-image','full-content'];

function applyLayout(l = {}) {
  if (typeof l === 'string') l = { type: l };
  const layoutType = LAYOUT_TYPES.includes(l.type) ? l.type : 'image-left';
  const card = document.getElementById('layout-card');
  const root = document.documentElement;

  if (card) {
    card.classList.remove(...LAYOUT_TYPES);
    card.classList.add(layoutType);
    card.dataset.layout = layoutType;
  }

  root.style.setProperty('--media-basis', l.mediaRatio || '46%');
  root.style.setProperty('--layout-gap', l.gap || '52px');
  root.style.setProperty('--card-padding', l.cardPadding || '52px');
  root.style.setProperty('--page-max-width', l.maxWidth || '1120px');

  const mp = document.getElementById('media-panel');
  if (mp) {
    if (layoutType === 'full-content') {
      mp.hidden = true;
      mp.setAttribute('aria-hidden', 'true');
    } else {
      mp.hidden = false;
      mp.removeAttribute('aria-hidden');
    }
  }
}

function renderTitle(h = {}) {
  const header = document.getElementById('page-header');
  if (!h.visible) { header && (header.hidden = true); return; }
  const eyebrow = document.getElementById('hdr-eyebrow');
  const eyebrowTxt = document.getElementById('eyebrow-text');
  const title = document.getElementById('hdr-title');
  const bar = document.getElementById('hdr-bar');
  if (eyebrow) eyebrow.style.display = h.eyebrow ? 'inline-flex' : 'none';
  if (eyebrowTxt) eyebrowTxt.textContent = h.eyebrow || '';
  if (title) { title.textContent = h.title || ''; title.className = 'page-title page-title--' + (h.align || 'left') + ' anim anim-d1'; }
  if (bar) { bar.style.display = h.accentBar ? 'block' : 'none'; bar.className = 'title-bar anim anim-d2 ' + (h.align !== 'left' ? 'title-bar--' + h.align : ''); }
  document.title = h.title || 'eLearning Module';
}

function renderMedia(m = {}) {
  const panel = document.getElementById('media-panel');
  if (!panel) return;
  if (!m.visible) { panel.hidden = true; return; }
  panel.hidden = false;
  const radius = m.borderRadius || '16px';
  const aspect = m.aspectRatio || '4/3';
  if (m.type === 'image') {
    if (!m.src) {
      panel.innerHTML = `<div class="media-placeholder" style="border-radius:${esc(radius)};aspect-ratio:${esc(aspect)};" role="img" aria-label="Image placeholder"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${IC.img}</svg><span class="media-placeholder-text">assets/hero.jpg</span></div>`;
    } else {
      panel.innerHTML = `<figure class="media-figure" style="border-radius:${esc(radius)};"><img class="media-img" src="${esc(m.src)}" alt="${esc(m.alt||'')}" style="aspect-ratio:${esc(aspect)};" loading="lazy" decoding="async"/>${m.caption ? '<figcaption class="media-caption">'+esc(m.caption)+'</figcaption>' : ''}</figure>`;
    }
  } else if (m.type === 'video') {
    const isEmbed = /youtube|vimeo/.test(m.src || '');
    panel.innerHTML = isEmbed ? `<div class="media-video" style="border-radius:${esc(radius)};"><iframe src="${esc(m.src)}" title="${esc(m.alt||'Video')}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>` : `<div class="media-video" style="border-radius:${esc(radius)};"><video controls preload="metadata"><source src="${esc(m.src)}" type="video/mp4">Your browser does not support video.</video></div>`;
  }
}

function renderContent(c = {}) {
  const panel = document.getElementById('content-panel');
  if (!panel) return;
  if (!c.visible) { panel.hidden = true; return; }
  panel.hidden = false;
  const hTag = c.headingTag || 'h2';
  let html = '';
  if (c.heading) html += `<${hTag} class="content-heading anim anim-d2">${esc(c.heading)}</${hTag}>`;
  if (c.body) html += `<div class="content-body anim anim-d3">${c.body}</div>`;
  (c.components || []).forEach((comp, i) => { html += `<div class="anim anim-d${Math.min(i + 3, 4)}">${renderComponent(comp.type, comp)}</div>`; });
  panel.innerHTML = html;
  wireInteractive(panel);
}

function renderComponent(type, data) {
  switch (type) {
    case 'feature-list': return `<ul class="feature-list" role="list">${(data.items || []).map(item => `<li class="feature-item" tabindex="0" role="listitem"><span class="feature-icon" aria-hidden="true">${IC[item.icon] || IC.check}</span><div class="feature-text"><div class="feature-title">${esc(item.title)}</div><div class="feature-desc">${esc(item.description)}</div></div></li>`).join('')}</ul>`;
    case 'callout': { const t = data.variant || 'info'; const m = { info: IC.info, success: IC.check, warn: IC.warn, danger: IC.warn }; return `<div class="callout callout--${esc(t)}" role="note">${m[t] || IC.info}<div>${data.text || ''}</div></div>`; }
    case 'scq': { const id = 'scq_' + uid(); return `<div class="quiz-block" id="${id}" data-type="scq" data-correct="${data.correctIndex ?? 0}"><span class="quiz-tag">${IC.quiz} Single Choice</span><p class="quiz-question">${esc(data.question || '')}</p><ul class="quiz-options" role="radiogroup">${(data.options || []).map((o, i) => `<li><div class="quiz-option" tabindex="0" role="radio" aria-checked="false" data-i="${i}"><span class="quiz-radio"></span><span>${esc(o.label || o)}</span></div></li>`).join('')}</ul><div class="quiz-actions"><button class="quiz-btn quiz-btn--primary" onclick="submitSCQ('${id}')">Check Answer</button><button class="quiz-btn quiz-btn--ghost" onclick="resetQuiz('${id}')">Reset</button></div><div class="quiz-feedback" id="${id}_fb"></div></div>`; }
    case 'mcq': { const id = 'mcq_' + uid(); const c = (data.correctIndices || []); return `<div class="quiz-block" id="${id}" data-type="mcq" data-correct='${JSON.stringify(c)}'><span class="quiz-tag">${IC.quiz} Multiple Choice</span><p class="quiz-question">${esc(data.question || '')}</p><ul class="quiz-options">${(data.options || []).map((o, i) => `<li><div class="quiz-option" tabindex="0" role="checkbox" aria-checked="false" data-i="${i}"><span class="quiz-checkbox"></span><span>${esc(o.label || o)}</span></div></li>`).join('')}</ul><div class="quiz-actions"><button class="quiz-btn quiz-btn--primary" onclick="submitMCQ('${id}')">Check Answers</button><button class="quiz-btn quiz-btn--ghost" onclick="resetQuiz('${id}')">Reset</button></div><div class="quiz-feedback" id="${id}_fb"></div></div>`; }
    case 'tabs': { const id = 'tabs_' + uid(); return `<div class="tabs-block" id="${id}"><nav class="tabs-nav" role="tablist">${(data.tabs || []).map((t, i) => `<button class="tab-btn" role="tab" aria-selected="${i===0}" data-i="${i}" onclick="switchTab('${id}',${i})">${esc(t.label)}</button>`).join('')}</nav>${(data.tabs || []).map((t, i) => `<div class="tab-panel ${i===0?'active':''}" role="tabpanel">${t.content || ''}</div>`).join('')}</div>`; }
    case 'accordion': return `<div class="accordion-block">${(data.items || []).map(item => { const pid = 'ap_' + uid(); return `<div class="accordion-item"><button class="accordion-trigger" aria-expanded="false" aria-controls="${pid}">${esc(item.title)}<span class="accordion-chevron" aria-hidden="true">${IC.chevron}</span></button><div class="accordion-panel" id="${pid}" role="region">${item.content || ''}</div></div>`; }).join('')}</div>`;
    case 'stats': return `<div class="stat-grid">${(data.items || []).map(s => `<div class="stat-card"><div class="stat-value">${esc(s.value)}</div><div class="stat-label">${esc(s.label)}</div></div>`).join('')}</div>`;
    case 'timeline': return `<div class="timeline">${(data.items || []).map(item => `<div class="timeline-item"><div class="timeline-line-col"><div class="timeline-dot"></div><div class="timeline-vline"></div></div><div class="timeline-content">${item.time ? '<div class="timeline-time">'+esc(item.time)+'</div>' : ''}<div class="timeline-title">${esc(item.title)}</div>${item.description ? '<div class="timeline-desc">'+esc(item.description)+'</div>' : ''}</div></div>`).join('')}</div>`;
    default: return '';
  }
}

function renderNavigation(n = {}) {
  const footer = document.getElementById('page-footer');
  if (!footer || !n.visible) { footer && (footer.hidden = true); return; }
  let progress = '';
  if (n.showProgress && n.totalPages > 1) {
    const pct = Math.round((n.currentPage / n.totalPages) * 100);
    progress = `<div class="progress-wrap" role="progressbar" aria-valuenow="${n.currentPage}" aria-valuemin="1" aria-valuemax="${n.totalPages}" aria-label="Course progress"><div class="progress-meta"><span class="progress-label">Module ${n.currentPage} of ${n.totalPages}</span><span class="progress-pct">${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }
  const prev = n.prevLabel && n.prevHref ? `<a href="${esc(n.prevHref)}" class="btn-secondary">${IC.arrowL} ${esc(n.prevLabel)}</a>` : '';
  const next = n.nextLabel ? `<a href="${esc(n.nextHref||'#')}" class="btn-primary">${esc(n.nextLabel)} ${IC.arrowR}</a>` : '';
  footer.innerHTML = `<nav class="nav-row" aria-label="Module navigation">${prev}${progress}${next}</nav>`;
}

function wireInteractive(root) {
  root.querySelectorAll('.quiz-option').forEach(opt => {
    opt.addEventListener('click', () => toggleOption(opt));
    opt.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleOption(opt); } });
  });
  root.querySelectorAll('.accordion-trigger').forEach(btn => {
    btn.addEventListener('click', () => {
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !expanded);
      const panel = document.getElementById(btn.getAttribute('aria-controls'));
      if (panel) panel.classList.toggle('open', !expanded);
    });
  });
  root.querySelectorAll('.tabs-block').forEach(block => {
    const btns = [...block.querySelectorAll('.tab-btn')];
    btns.forEach((b, i) => {
      b.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') { e.preventDefault(); const n = (i+1) % btns.length; switchTab(block.id, n); btns[n].focus(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); const n = (i-1+btns.length)%btns.length; switchTab(block.id,n); btns[n].focus(); }
      });
    });
  });
}

function toggleOption(opt) {
  const block = opt.closest('.quiz-block');
  if (!block) return;
  if (block.dataset.type === 'scq') {
    block.querySelectorAll('.quiz-option').forEach(o => { o.classList.remove('sel'); o.setAttribute('aria-checked','false'); });
    opt.classList.add('sel'); opt.setAttribute('aria-checked','true');
  } else {
    const nv = opt.classList.toggle('sel');
    opt.setAttribute('aria-checked', nv);
  }
}

window.submitSCQ = id => {
  const block = document.getElementById(id);
  if (!block) return;
  const correct = parseInt(block.dataset.correct ?? '0');
  const sel = block.querySelector('.quiz-option.sel');
  const fb = document.getElementById(id + '_fb');
  if (!sel) { if (fb) { fb.className='quiz-feedback err'; fb.textContent='Please select an answer.'; } return; }
  const idx = parseInt(sel.dataset.i);
  block.querySelectorAll('.quiz-option').forEach((o, i) => {
    o.classList.remove('sel','ok','err');
    if (i === correct) o.classList.add('ok');
    else if (i === idx) o.classList.add('err');
  });
  if (fb) {
    const right = idx === correct;
    fb.className = 'quiz-feedback ' + (right ? 'ok' : 'err');
    fb.textContent = right ? '✓ Correct! Great work.' : '✗ Not quite. See the correct answer highlighted above.';
  }
};

window.submitMCQ = id => {
  const block = document.getElementById(id);
  if (!block) return;
  const correct = JSON.parse(block.dataset.correct || '[]');
  const fb = document.getElementById(id + '_fb');
  block.querySelectorAll('.quiz-option').forEach((o, i) => {
    const wasSel = o.classList.contains('sel');
    o.classList.remove('sel','ok','err');
    if (correct.includes(i)) o.classList.add('ok');
    else if (wasSel) o.classList.add('err');
  });
  if (fb) { fb.className='quiz-feedback ok'; fb.textContent='Answers checked! Correct selections are highlighted in green.'; }
};

window.resetQuiz = id => {
  const block = document.getElementById(id);
  if (!block) return;
  block.querySelectorAll('.quiz-option').forEach(o => { o.classList.remove('sel','ok','err'); o.setAttribute('aria-checked','false'); });
  const fb = document.getElementById(id + '_fb');
  if (fb) { fb.className='quiz-feedback'; fb.textContent=''; }
};

window.switchTab = (id, idx) => {
  const block = document.getElementById(id);
  if (!block) return;
  block.querySelectorAll('.tab-btn').forEach((b, i) => b.setAttribute('aria-selected', i === idx));
  block.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
};

window.eLearning = { applyTheme, applyLayout, renderTitle, renderMedia, renderContent, renderNavigation, renderComponent };

async function loadConfig() {
  // Prefer external JSON so authors can update content/layout without editing HTML.
  try {
    const res = await fetch('page.json', { cache: 'no-store' });
    if (res.ok) {
      return await res.json();
    }
  } catch (err) {
    console.warn('[eLearning] Failed to load page.json, using embedded config.', err);
  }

  const configEl = document.getElementById('page-config');
  if (!configEl) {
    throw new Error('Missing embedded config (#page-config).');
  }

  return JSON.parse(configEl.textContent);
}

async function boot() {
  try {
    const cfg = await loadConfig();
    applyTheme(cfg.theme || {});
    applyLayout(cfg.layout || {});
    renderTitle(cfg.header || {});
    renderMedia(cfg.media || {});
    renderContent(cfg.content || {});
    renderNavigation(cfg.navigation || {});
    const live = document.getElementById('sr-live');
    if (live) live.textContent = (cfg.header?.title || 'Page') + ' loaded.';
  } catch(err) {
    console.error('[eLearning] Boot error:', err);
    const main = document.getElementById('page-main');
    if (main) main.innerHTML = `<div style="padding:40px;text-align:center;color:#EF4444"><strong>JSON Config Error</strong><br><code style="font-size:.8rem">${esc(err.message)}</code></div>`;
  }
  const loader = document.getElementById('page-loading');
  if (loader) { loader.classList.add('out'); setTimeout(() => loader.style.display='none', 450); }
}

document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', boot) : boot();
</script>
</body>
</html>
