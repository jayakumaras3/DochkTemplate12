<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Width and Height HTML Page with Iframe</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Prevent scrollbars */
    }
    #contentContainer {
        width: 100%;
        height: 100%;
    }
    #quizInlineLoader {
        position: absolute;
        inset: 0;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }
    .quiz-inline-spinner {
        width: 50px;
        height: 50px;
        animation: quizInlineSpin 1.2s linear infinite;
    }
    .quiz-inline-spinner .track { stroke: #B8ECEA; }
    .quiz-inline-spinner .arc {
        stroke: #00A0A5;
        stroke-dasharray: 94 32;
        stroke-linecap: round;
    }
    @keyframes quizInlineSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }
</style>
<script src="../../../theme/scripts/QuizTemplate/Quiz/script.js"></script>
<script>
   function hideShellSpinner() {
       var el = document.getElementById('quizInlineLoader');

	var clicknote= "Click Start to begin.";
	var TotalQuestionste="";

	var passingScorete="";
	var durationte="";
	var TimeUpte="";
   
</script
</head>
<body>
    <div id="contentContainer"></div>
    <div id="quizInlineLoader">
        <svg class="quiz-inline-spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
            <circle class="track" cx="25" cy="25" r="20" fill="none" stroke-width="5"/>
            <circle class="arc" cx="25" cy="25" r="20" fill="none" stroke-width="5" transform="rotate(-90 25 25)"/>
        </svg>

</body>
</html>
