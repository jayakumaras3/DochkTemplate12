<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Quiz</title>
    <script>
    /* iPad Safari can report pointer:fine / hover:hover (e.g. with a
       trackpad/Magic Keyboard attached, or in its default "desktop site"
       mode), so CSS alone can't reliably tell an iPad from a laptop with a
       mouse. navigator.maxTouchPoints is the standard capability check
       (unaffected by input peripherals or UA spoofing) used to flag real
       touch hardware; the width check keeps large touch-screen desktops
       out. This is a one-time class toggle -- no listeners, no polling --
       Quiz_style.css does the actual responsive work from here via plain
       CSS media queries. */
    (function () {
        var isTouch = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
        if (isTouch && window.innerWidth <= 1366) {
            document.documentElement.classList.add('is-touch-device');
        }

        /* This page runs inside an iframe chain the course chrome creates
           around it (Quiz.html <- per-quiz wrapper <- course window that
           owns the .headingArea course header). Depending on the host
           (standalone browser vs. the reload SCORM player frameset), that
           chain can end up positioned so the course header overlaps this
           page's top edge and clips the "Questions X of Y" bar.

           Rather than hardcode anything, measure the actual INTRUSION:
           walk up the same-origin frameElement chain accumulating this
           viewport's top offset within each ancestor's viewport; when the
           document owning .headingArea is reached, the overlap is the
           header's bottom edge minus our accumulated top. That is 0 when
           the layout already places this iframe below the header (a
           standalone launch) and the exact covered height when it does
           not (the player) -- so the CSS clearance driven by
           --outer-header-overlap self-adjusts per host with no guessed
           constants. Re-measured on resize/load (event-driven, no timers)
           because the hosting chrome reflows with the window.

           Every step is defensive: a cross-origin ancestor or a missing
           .headingArea leaves the variable unset and Quiz_style.css's
           fallbacks (0 on desktop, the legacy 64px on touch) take over --
           nothing here can break the page if the assumption doesn't hold. */
        function updateOuterHeaderClearance() {
            try {
                var offsetTop = 0;
                var w = window;
                var overlap = null;
                for (var depth = 0; depth < 4; depth++) {
                    var fe = w.frameElement;
                    if (!fe) break; /* reached the top window */
                    offsetTop += fe.getBoundingClientRect().top;
                    w = w.parent;
                    var header = w.document.querySelector('.headingArea');
                    if (header) {
                        overlap = header.getBoundingClientRect().bottom - offsetTop;
                        break;
                    }
                }
                if (overlap !== null) {
                    overlap = Math.max(0, Math.min(150, overlap));
                    document.documentElement.style.setProperty('--outer-header-overlap', overlap.toFixed(1) + 'px');
                }
            } catch (e) {
                /* Cross-origin or structural mismatch: CSS fallbacks cover this. */
            }
        }
        updateOuterHeaderClearance();
        window.addEventListener('resize', updateOuterHeaderClearance);
        window.addEventListener('load', updateOuterHeaderClearance);
    })();
    </script>
    <link rel="stylesheet" href="../../../css/Quiz_style.css">
    <link rel="stylesheet" href="../../../css/Color.css">
    <link rel="stylesheet" href="../../../css/QuestionOptions.css">
</head>
<body>
 <div id="parentquizContainer">	</div>
	 <div id="quizContainer"></div>
	
			

   
    <script src="quiz.js"></script>
</body>
</html>
