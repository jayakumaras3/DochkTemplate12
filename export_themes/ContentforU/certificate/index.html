<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Certificate of Completion</title>
  <link rel="stylesheet" href="../css/certificate.css"/>
</head>
<body>
  <div id="printContent">
    
    <!-- Header Image -->
    <img id="header-img" class="header-footer-image" src="" alt="Header" />

    <!-- Main Content -->
    <div id="content">
      <div class="center-content">
        <h1 id="certificate-title"></h1><br /><br />
        <h2 id="user-name"></h2><br /><br />
        <p id="completion-text"></p><br /><br />
        <h2 id="course-title"></h2><br /><br />
      </div>

      <div class="info-block">
        <p><b id="date-label"></b></p>
        <p id="date-value"></p><br /><br />
        <p id="issuer-left" class="left"></p>
        <p id="issuer-right" class="right"></p><br />
        <p id="signature-left" class="left"></p><br /
        <p id="signature-right" class="right"></p>
      </div>
    </div>

    <!-- Footer Image -->
    <img id="footer-img" class="header-footer-image" src="" alt="Footer" />
	<br>
    
  </div>

  <script src="certificate.js"></script>
</body>
</html>
