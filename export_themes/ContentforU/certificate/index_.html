<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate of Completion</title>
  <link rel="stylesheet" href="certificate.css" />
</head>
<body>
  <div id="certificate">
    <img id="header" class="banner" src="" alt="Header" />
    
    <div class="content">
      <h1 id="title"></h1>
      <h2 id="username"></h2>
      <p id="completion-text"></p>
      <h2 id="course-name"></h2>
    </div>

    <div class="footer-content">
      <div class="left">
        <p><b id="date-label"></b></p>
        <p id="date-value"></p><br><br>
        <p id="sign-left-name"></p>
        <p id="sign-left-role"></p>
      </div>
      <div class="right">
        <p id="sign-right-name"></p>
        <p id="sign-right-role"></p>
      </div>
    </div>

    <img id="footer" class="banner" src="" alt="Footer" />
  </div>

  <script src="certificate.js"></script>
</body>
</html>
