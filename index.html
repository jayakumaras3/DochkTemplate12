    <script>
    /* iPad Safari can report pointer:fine / hover:hover (e.g. with a
       trackpad/Magic Keyboard attached, or in its default "desktop site"
       mode), so CSS alone can't reliably tell an iPad from a laptop with
       a mouse - and several iPad landscape widths (1024-1366px CSS
       points) overlap common laptop resolutions, so width/orientation
       media queries alone can't either. navigator.maxTouchPoints is the
       standard capability check (unaffected by input peripherals or UA
       spoofing) used to flag real touch hardware; the width check keeps
       large touch-screen desktops out. One-time class toggle, no
       listeners, no polling - Color.css does the responsive work from
       here via plain CSS media queries scoped to html.is-touch-device.
       Same pattern already used in MCQ.html / SCQ.html / Quiz.html. */
    (function () {
        var isTouch = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
        if (isTouch && window.innerWidth <= 1366) {
            document.documentElement.classList.add('is-touch-device');
        }
    })();
    </script>

 <style>
        /* ── Overlay ── */
        #courseLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }
        /* ── Fade-out ── */
        .loader-hide {
            opacity: 0;
            transition: opacity .5s ease;
            pointer-events: none;
        }
        /* ── Vertical stack: logo + card ── */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* ── Logo ── */
        .loader-logo {
            width: 300px;
            height: auto;
            margin-bottom: 0;
        }
        /* ── Card ── */
        .loader-card {
            width: 380px;
            min-height: 300px;
            border: 4px solid #ACD2DF;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: #ffffff;
        }
        /* ── SVG Spinner ── */
        .touchstone-spinner {
            width: 65px;
            height: 72px;
            animation: touchstoneSpin 1.2s linear infinite;
            flex-shrink: 0;
        }
        .touchstone-spinner .track { stroke: #83B4C5; }
        .touchstone-spinner .arc   {
            stroke: #0088BB;
            stroke-dasharray: 94 32;
            stroke-linecap: round;
        }
        @keyframes touchstoneSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        /* ── Loading text ── */
        .loader-text {
            font-size: 17px;
            color: #0088BB;
            font-weight: 400;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        /* ── Tablet ── */
        @media (max-width: 900px) {
            .loader-logo  { width: 240px; }
            .loader-card  { width: 320px; min-height: 240px; gap: 22px; }
            .touchstone-spinner { width: 58px; height: 58px; }
            .loader-text  { font-size: 15px; }
        }
        /* ── Mobile ── */
        @media (max-width: 520px) {
            .loader-logo  { width: 180px; }
            .loader-card  { width: 82vw; min-height: 200px; border-radius: 18px; gap: 18px; }
            .touchstone-spinner { width: 48px; height: 48px; }
            .loader-text  { font-size: 14px; }
        }
    </style>
