    <style>
        /* ── Overlay ── */
        #courseLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        /* ── Fade-out (kept from original logic) ── */
        .loader-hide {
            opacity: 0;
            transition: opacity .5s ease;
            pointer-events: none;
        }

        /* ── Vertical stack: logo + card ── */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Logo ── */
        .loader-logo {
            width: 300px;
            height: auto;
            margin-bottom: 0;
        }

        /* ── Card ── */
        .loader-card {
            width: 380px;
            min-height: 220px;
            border: 4px solid #ACD2DF;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #ffffff;
        }

        /* ── Spinner ── */
        .touchstone-spinner {
            width: 72px;
            height: 72px;
            animation: touchstoneSpin 1.2s linear infinite;
            flex-shrink: 0;
        }
        .touchstone-spinner .track {
            stroke: #83B4C5;
        }
        .touchstone-spinner .arc {
            stroke: #0088BB;
            stroke-dasharray: 94 32;
            stroke-linecap: round;
        }

        @keyframes touchstoneSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* ── Loading text ── */
        .loader-text {
            font-size: 17px;
            color: #0088BB;
            font-weight: 400;
            font-family: Arial, sans-serif;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* ── Tablet (≤ 900px) ── */
        @media (max-width: 900px) {
            .loader-logo          { width: 240px; margin-bottom: 14px; }
            .loader-card          { width: 360px; min-height: 240px; gap: 24px; }
            .touchstone-spinner   { width: 76px; height: 76px; border-width: 8px; }
            .loader-text          { font-size: 19px; }
        }

        /* ── Mobile (≤ 520px) ── */
        @media (max-width: 520px) {
            .loader-logo          { width: 180px; margin-bottom: 12px; }
            .loader-card          { width: 82vw; min-height: 210px; border-radius: 18px; gap: 18px; }
            .touchstone-spinner   { width: 60px; height: 60px; border-width: 7px; }
            .loader-text          { font-size: 16px; }
        }
    </style>

        <div class="loader-card">
            <svg class="touchstone-spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">

	<div id="resumemainContainer" class="resume_container" role="dialog" aria-modal="true" aria-labelledby="Resumeheading" aria-describedby="resume_id" tabindex="0">
  <div class="preloaderDisplayresume" aria-hidden="true"></div>

  <div id="resumeArea" class="resume_content_container">
    <div  tabindex="0" id="Resumeheading" class="resume_content_header ColorSet_CR FSize18">
      Resume
    </div>

    <div  tabindex="0" id="resume_id" class="resume_content_text FSize17">
      Are you sure you want to continue where you left?
    </div>

    <div class="row h-100" role="group" aria-label="Resume confirmation buttons">
      <div class="col-xs-6 text-center">
        <button  tabindex="0"
          id="resumeyes"
          onclick="yesBtnClick()"
          class="btn btn-large btn-default text-center yes-btn ColorSet_CR"
          aria-label="Yes"
        >
          Yes
        </button>
      </div>
      <div class="col-xs-6 text-center">
        <button  tabindex="0"
          id="resumeno"
          onclick="noBtnClick()"
          class="btn btn-large btn-default text-center no-btn ColorSet_CR"
          aria-label="No"
        >
          No
        </button>
      </div>
    </div>
  </div>
